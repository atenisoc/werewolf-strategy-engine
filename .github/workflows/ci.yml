name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Smoke simulation (every size, leak audit)
        run: |
          for n in 5 7 9 13 15; do node dist/sim.js --n $n --games 100 --seed 1 --audit | tail -3; done
